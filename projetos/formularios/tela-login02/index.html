<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login anime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <section class="image">
            <img src="img/bg2.jpg" alt="bg">

        </section>

        <section class="form">
            <form action="">
                <h1>Login</h1>
                <input type="text" name="user" id="iuser" placeholder="User">
                <input type="text" name="password" id="ipassword" placeholder="Password">
                <input id="btn-entrar" type="submit" value="Entrar">
                <p>Não possui uma conta? <a href="#">Cadastre-se</a></p>
                <h2>Logar com</h2>
                <div class="icons-container">
                    <a href="#"><img class="icon" src="img/facebook-icon.png" alt="facebook"></a>
                    <a href="#"><img class="icon" src="img/search.png" alt="google"></a>
                    <a href="#"><img class="icon" src="img/apple-logo2.png" alt="apple"></a>
                </div>
            </form>

        </section>
    </main>
    
</body>
</html>
