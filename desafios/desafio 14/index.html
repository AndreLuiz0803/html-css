<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela boletim</title>
</head>

<style>
    table{
        margin: auto;
        font-family: Arial, Helvetica, sans-serif;
        border-collapse: collapse;
    }

    caption{
        font-size: 1.3em;
        font-weight: bold;
        padding: 10px;

    }

    th, td{
        border: 1px solid darkgray;
        padding: 10px;
    }

    th{
        text-align: center;
        background-color: gray;
        color: white;
    }

    .nota{
        text-align: center;
    }

    .colwhite{
        background-color: white;
        color: black;
    }

    tr.destaque > th{
        text-align: left;
    }

    tr.destaque > td{
        background-color: gray;
        color: white;
        text-align: center;
    }
</style>
<body>
    <table>
        <thead>
            <caption>Boletim</caption>
            <tr>
                <th>Área</th>
                <th>Disciplinas</th>
                <th colspan="2">Notas</th>
                <th>Média</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" class="colwhite">Exatas</th>
                <td>Matemática</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr class="destaque">
                <th colspan="4">Média de Exatas</th>
                <td>0.0</td>
            </tr>

            <tr>
                <th class="colwhite" rowspan="2">Humanas</th>
                <td>História</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
                <td class="nota">0.0</td>
            </tr>

            <tr class="destaque">
                <th colspan="4">Média de Humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
