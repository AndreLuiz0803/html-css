<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --bg:rgb(14, 17, 24);
            --bg2:rgb(5, 6, 8);
            --font:rgb(80, 97, 136);
            --h1:rgb(124, 151, 214);
            --limpar:rgb(238, 134, 134);
        }
        *{
            padding: 0;
            margin: 0;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(14, 17, 24);
            padding: 40px;
        }

        h1{
            color: var(--h1);
        }

        form fieldset{
            border: 2px solid var(--h1);
            color: var(--h1);
            width: 400px;
            padding: 20px;
            margin-top: 10px;
        }

        form fieldset p{
            color: var(--h1);
            margin: 15px 0px;
        }

        form fieldset p input{
            all: unset;
            background-color: var(--bg2);
            padding: 10px;
            border-radius: 5px;
        }

        ::-webkit-input-placeholder{
            color: var(--font);
        }

        .btns{
            display: flex;
            gap: 1.5rem;
            margin-top: 20px;
        }

        #btn-enviar{
            all: unset;
            background-color: var(--h1);
            padding: 10px;
            border-radius: 5px;
            color: var(--bg);
            font-weight: 700;
            cursor: pointer;
        }
        #btn-limpar{
            all: unset;
            background-color: var(--limpar);
            padding: 10px;
            border-radius: 5px;
            color: var(--bg);
            font-weight: 700;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" required placeholder="Nome">
            </p>
            <p>
                <label for="isobrenome">Sobrenome</label>
                <input type="text" name="nome" id="isobrenome" required placeholder="Sobrenome">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="text" name="email" id="iemail" required placeholder="E-mail">
            </p>
            <p>
                <label for="itelefone">Telefone</label>
                <input type="text" name="telefone" id="itelefone" required placeholder="(xx)xxxxx-xxxx" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
        </fieldset>
        <div class="btns">
            <input id="btn-enviar" type="submit" value="Enviar">
            <input id="btn-limpar" type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
