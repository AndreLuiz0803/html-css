<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de formulário</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(171, 205, 247);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: poppins, Helvetica, sans-serif;
            gap: 1rem;
            padding: 1rem;
        }

        form{
            display: flex;
            flex-direction: column;
            background-color: rgb(12, 18, 26);
            padding: 2rem;
            border-radius: 1rem;
            gap: .6rem;
            width: 400px;
        }

        form label{
            text-align: left;
            color: white;
        }

        form #inome, #isobrenome, #imedia, #idata, #ihorario{
            all: unset;
            background-color: rgb(32, 48, 68);
            border-radius: .2rem;
            padding: .3rem .5rem;
            color: rgb(103, 168, 247);
        }

        #ihorario{
            margin-bottom: 1rem;
        }

        form #btn-enviar, #btn-limpar{
            background-color: rgb(32, 87, 155);
            color: white;
            border: none;
            border-radius:.2rem;
            padding:.7rem;
            cursor: pointer;
            width: 40%;
            margin: auto;
        }

        form #btn-enviar:hover, #btn-limpar:hover{
            width: 100%;
            background-color: rgb(41, 112, 199);
            transition: .4s;
        }

        @media screen and (max-width: 720px){
            form{
                width: 350px;
            }
        }
        @media screen and (max-width: 380px){
            form{
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <label for="inome">Nome</label>
        <input type="text" name="nome" id="inome" required maxlength="30">

        <label for="isobrenome">Sobrenome</label>
        <input type="text" name="sobrenome" id="isobrenome" required maxlength="30">

        <label for="imedia">Média</label>
        <input type="number" step="0.1" name="media" id="imedia" required min="0" max="10">

        <label for="idate">Dia da prova</label>
        <input type="date" name="data" id="idata" required >

        <label for="ihorario">Dia da prova</label>
        <input type="time" name="horario" id="ihorario" required >
        
        <input id="btn-enviar" type="submit" value="Enviar">
        <input id="btn-limpar" type="reset" value="Limpar">

    </form>
    
</body>
</html>
